<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 9 Vocab Master - Glass Edition</title>
    <meta name="description" content="Isaac's Grade 9 Term 1 vocabulary flashcards — G.T. Reading & Headway, organised by week, with word families.">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --primary-text: #ffffff;
            --accent-yellow: #ffee58;
            --accent-blue: #81d4fa;
            --card-front: rgba(255, 255, 255, 0.2);
            --card-back: rgba(255, 253, 231, 0.95);
            --text-dark: #1a237e;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 25%, #312e81 50%, #1e1b4b 75%, #0f172a 100%);
            background-attachment: fixed;
            color: var(--primary-text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(15px);
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid var(--glass-border);
        }

        .site-title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--accent-yellow);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .search-box {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            display: flex;
            align-items: center;
        }

        #vocabSearch {
            width: 100%;
            padding: 15px 50px 15px 25px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }

        #vocabSearch:focus {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(129, 212, 250, 0.3);
        }

        .clear-search {
            position: absolute;
            right: 15px;
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            transition: 0.2s;
            user-select: none;
        }

        .clear-search:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.1);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .week-title {
            font-size: 1.8rem;
            margin: 40px 0 20px;
            color: var(--accent-yellow);
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            border-left: 5px solid var(--accent-yellow);
            padding-left: 15px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 50px;
            padding: 20px 0;
        }

        .stack-wrapper {
            position: relative;
            height: 200px;
            width: 100%;
            perspective: 1000px;
        }

        .card-stack {
            position: relative;
            width: 100%;
            height: 100%;
            cursor: pointer;
            transition: 0.5s ease;
            transform-style: preserve-3d;
        }

        .card-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--card-front);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transform-style: preserve-3d;
        }

        .card-item:nth-child(2) { transform: translate(6px, 6px); z-index: -1; opacity: 0.8; }
        .card-item:nth-child(3) { transform: translate(12px, 12px); z-index: -2; opacity: 0.6; }
        .card-item:nth-child(n+4) { display: none; }

        .card-stack:hover .card-item:nth-child(2) { transform: translate(12px, 12px); }
        .card-stack:hover .card-item:nth-child(3) { transform: translate(24px, 24px); }

        #focusOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
            backdrop-filter: blur(0px);
            transition: opacity 0.4s ease, backdrop-filter 0.4s ease, visibility 0s linear 0.4s;
        }

        #focusOverlay.active {
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
            backdrop-filter: blur(20px);
            transition: opacity 0.4s ease, backdrop-filter 0.4s ease, visibility 0s linear 0s;
        }

        .focus-container {
            width: 90%;
            max-width: 800px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 40px;
            overflow-y: auto;
            scroll-behavior: smooth;
            opacity: 0;
            transform-origin: center center;
        }

        .focus-container.animate-in {
            opacity: 1;
            transform: translate(0, 0) scale(1) !important;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
        }

        .focus-card {
            min-height: 250px;
            position: relative;
            perspective: 1000px;
            width: 100%;
            flex-shrink: 0;
        }

        .focus-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .focus-card.flipped .focus-card-inner {
            transform: rotateY(180deg);
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            border: 1px solid var(--glass-border);
        }

        .face-front {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            align-items: center;
        }

        .face-back {
            background: var(--card-back);
            color: var(--text-dark);
            transform: rotateY(180deg);
            text-align: left;
        }

        .word-main { font-size: 2rem; font-weight: 800; color: var(--accent-blue); margin: 0; }
        .pos-badge { background: var(--accent-blue); color: #000; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; margin-top: 10px; }
        .family-label { position: absolute; top: 15px; left: 15px; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.5); }

        .chi-def { font-size: 1.4rem; color: #d32f2f; font-weight: bold; margin-bottom: 15px; }
        .eng-def { font-size: 1rem; line-height: 1.5; margin-bottom: 15px; color: #444; }
        .ex-sentence { font-style: italic; color: #555; border-left: 4px solid var(--accent-blue); padding-left: 15px; font-size: 0.95rem; }

        .close-btn {
            position: fixed;
            top: 30px;
            right: 30px;
            color: white;
            font-size: 3rem;
            cursor: pointer;
            z-index: 2001;
            opacity: 0;
            transition: opacity 0.5s ease 0.2s;
        }

        #focusOverlay.active .close-btn {
            opacity: 1;
        }

        .focus-container::-webkit-scrollbar { width: 8px; }
        .focus-container::-webkit-scrollbar-track { background: transparent; }
        .focus-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        @media (max-width: 600px) {
            .vocab-grid { grid-template-columns: 1fr; }
            .focus-container { padding: 10px; }
            .word-main { font-size: 1.5rem; }
        }
    </style>
</head>

    function renderMainGrid(data = allData) {
        const container = document.getElementById('mainApp');
        container.innerHTML = '';

        data.forEach(section => {
            const sec = document.createElement('div');
            const count = section.items.length;
            sec.innerHTML = `<h2 class="week-title">${section.week} <span style="font-size:0.9rem;color:rgba(255,255,255,0.4)">· ${count} headwords</span></h2>`;

            const grid = document.createElement('div');
            grid.className = 'vocab-grid';

            section.items.forEach(item => {
                const stackWrapper = document.createElement('div');
                stackWrapper.className = 'stack-wrapper';
                stackWrapper.onclick = (e) => openFocus(item, e.currentTarget);

                const stack = document.createElement('div');
                stack.className = 'card-stack';

                const stackLabel = (item.pos && item.pos.indexOf('phr') !== -1) || (item.pos && item.pos.indexOf('phrase') !== -1) ? 'PHRASE' : 'ROOT';

                let stackContent = `
                    <div class="card-item">
                        <span class="family-label">${stackLabel}</span>
                        <h3 class="word-main" style="font-size:1.4rem">${item.root}</h3>
                        <span class="pos-badge">${item.pos}</span>
                    </div>
                `;
                if (item.family) {
                    item.family.forEach((f, idx) => {
                        if (idx < 2) {
                            stackContent += `<div class="card-item"></div>`;
                        }
                    });
                }

                stack.innerHTML = stackContent;
                stackWrapper.appendChild(stack);
                grid.appendChild(stackWrapper);
            });

            sec.appendChild(grid);
            container.appendChild(sec);
        });
    }

    function openFocus(item, originElement) {
        const overlay = document.getElementById('focusOverlay');
        const container = overlay.querySelector('.focus-container');

        container.classList.remove('animate-in');
        container.innerHTML = '';

        if (originElement) {
            const rect = originElement.getBoundingClientRect();
            const originX = rect.left + rect.width / 2;
            const originY = rect.top + rect.height / 2;
            const screenX = window.innerWidth / 2;
            const screenY = window.innerHeight / 2;
            const deltaX = originX - screenX;
            const deltaY = originY - screenY;

            container.style.transition = 'none';
            container.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(0.2)`;
        }

        const stackLabel = (item.pos && item.pos.indexOf('phr') !== -1) || (item.pos && item.pos.indexOf('phrase') !== -1) ? 'PHRASE' : 'ROOT WORD';

        container.appendChild(createFocusCard(item.root, item.pos, item.chi, item.eng, item.ex, stackLabel));
        if (item.family) {
            item.family.forEach(f => {
                container.appendChild(createFocusCard(f.word, f.pos, f.chi, f.eng, f.ex, 'RELATED FORM'));
            });
        }

        overlay.classList.add('active');
        void container.offsetHeight;

        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                container.style.transition = '';
                container.style.transform = '';
                container.classList.add('animate-in');
            });
        });

        document.body.style.overflow = 'hidden';
    }

    function createFocusCard(word, pos, chi, eng, ex, labelText) {
        const div = document.createElement('div');
        div.className = 'focus-card';
        div.onclick = function() { this.classList.toggle('flipped'); };
        div.innerHTML = `
            <div class="focus-card-inner">
                <div class="face face-front">
                    <span class="family-label">${labelText}</span>
                    <h2 class="word-main">${word}</h2>
                    <span class="pos-badge">${pos}</span>
                    <div style="margin-top:20px; font-size:0.7rem; color:rgba(255,255,255,0.4)">CLICK TO FLIP</div>
                </div>
                <div class="face face-back">
                    <div class="chi-def">${chi}</div>
                    <div class="eng-def">${eng}</div>
                    <div class="ex-sentence">"${ex}"</div>
                </div>
            </div>
        `;
        return div;
    }

    function closeFocus() {
        const overlay = document.getElementById('focusOverlay');
        const container = overlay.querySelector('.focus-container');
        overlay.classList.remove('active');
        container.classList.remove('animate-in');
        document.body.style.overflow = 'auto';
    }

    function filterVocabs() {
        const searchInput = document.getElementById('vocabSearch');
        const clearBtn = document.getElementById('clearBtn');
        const query = searchInput.value.toLowerCase();

        if (query.length > 0) {
            clearBtn.style.display = 'flex';
        } else {
            clearBtn.style.display = 'none';
        }

        const filtered = allData.map(section => {
            return {
                ...section,
                items: section.items.filter(item => {
                    const matchRoot = item.root.toLowerCase().includes(query);
                    const matchChi = item.chi.toLowerCase().includes(query);
                    const matchEng = item.eng.toLowerCase().includes(query);
                    const matchWeek = section.week.toLowerCase().includes(query);
                    const matchFamily = item.family && item.family.some(f =>
                        f.word.toLowerCase().includes(query) || f.chi.toLowerCase().includes(query));
                    return matchRoot || matchChi || matchEng || matchWeek || matchFamily;
                })
            };
        }).filter(section => section.items.length > 0);

        renderMainGrid(filtered);
    }

    function clearSearch() {
        const searchInput = document.getElementById('vocabSearch');
        searchInput.value = '';
        filterVocabs();
        searchInput.focus();
    }

    window.onload = () => renderMainGrid();
</script>
