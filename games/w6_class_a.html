<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radio Recall</title><style>*{box-sizing:border-box}body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:linear-gradient(145deg,#0c2440,#354d88);color:#eef6ff;margin:0;min-height:100vh}.wrap{max-width:680px;margin:auto;padding:20px 14px 40px}h1{font-size:clamp(24px,5vw,36px);margin:7px 0}p{line-height:1.5}.sub{color:#cddcff}.stage{text-align:center;font-size:50px;margin:14px 0;min-height:70px}.actor{display:inline-block;animation:bob 2s ease-in-out infinite}.actor.work{animation:work .6s ease-out}.actor.sleep{filter:grayscale(1);transform:rotate(22deg)}.beam{font-size:27px;display:inline-block;margin:0 12px}.beam.lit{animation:shine .7s ease-out}.card,.end{background:#fff;color:#1b2c4a;padding:22px;border-radius:18px;box-shadow:0 18px 38px #08182c66}.card.shake{animation:shake .35s}.prompt{font-size:clamp(19px,4.4vw,25px);font-weight:700;line-height:1.5;margin:16px 0}.progress{font-size:14px;color:#aee8ff;margin-bottom:12px}.feedback{background:#e9f4ff;border-left:5px solid #408ed0;border-radius:8px;padding:12px;margin:14px 0;animation:rise .25s}.bad{border-left-color:#dc6370;background:#ffedf0}.opt,button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;min-height:48px}button{background:#266dc3;color:white;font-weight:700}.opt{display:block;width:100%;text-align:left;background:#e7effa;color:#193258;margin:9px 0}.opt:hover{background:#cce3ff}.opt:disabled{opacity:.7;cursor:default}button:disabled{opacity:.5}.row{display:flex;gap:9px;flex-wrap:wrap}.yes{background:#188b64}.no{background:#c15058}.next{background:#664dba}.miss{background:#fff0f1;border-radius:8px;padding:9px;margin:8px 0;line-height:1.45}.review{max-height:340px;overflow:auto}.input{width:100%;min-height:45px;border:2px solid #a8bfdc;border-radius:8px;font:inherit;padding:8px;margin-bottom:10px}@keyframes bob{50%{transform:translateY(-6px)}}@keyframes work{50%{transform:scale(1.22) rotate(-8deg)}}@keyframes shine{50%{filter:drop-shadow(0 0 20px #ffe25d);transform:scale(1.5)}}@keyframes shake{25%,75%{transform:translateX(-7px)}50%{transform:translateX(7px)}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:480px){.card{padding:17px}.row button{flex:1}}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}</style></head><body><div class="wrap"><h1>Radio Recall · W6 Set A</h1><p class="sub">In class: say your answer → reveal the rule → self-mark → next. Typed answers are optional.</p><div class="stage">📻 <span class="actor">🧑‍🎓</span> 🏘️</div><div class="card" id="card"><div class="progress" id="progress"></div><div class="prompt" id="prompt"></div><label for="typed">Optional written response</label><input class="input" id="typed" aria-label="Optional written answer"><div><button id="reveal" onclick="reveal()">Reveal answer + why</button></div><div class="feedback" id="feedback" hidden></div><div class="row" id="mark" hidden><button class="yes" onclick="mark(true)">Correct</button><button class="no" onclick="mark(false)">Needs practice</button></div><button class="next" id="advance" onclick="next()" hidden>Next →</button></div><div class="end" id="end" hidden><h2 id="result"></h2><h3>Every attempted item · mistakes highlighted</h3><div class="review" id="review"></div><button onclick="reset()">Restart</button></div><p class="sub">G9 · Term 1 · Week 6 · Set A · Local practice, not a school-quiz result</p></div><script>const BANK=[{"s": "Keep or fix: The weather bulletin has been updated by Felix today, so it is ready now.", "a": "Correct as written.", "w": "The bulletin receives the action; has been updated is present perfect passive."}, {"s": "→PASSIVE: The assistants were sorting the donated books at noon. Keep the doer, ongoing aspect and time.", "a": "The donated books were being sorted by the assistants at noon.", "w": "Plural books receive an ongoing past action: were being sorted."}, {"s": "Choose since or for: Our youth show has used this theme tune _____ 2024, when it began, and still uses it.", "a": "since", "w": "2024 is the starting point of continuing use."}, {"s": "→ACTIVE: The cameras were being cleaned by Pablo when the guest arrived. Keep the ongoing aspect.", "a": "Pablo was cleaning the cameras when the guest arrived.", "w": "Pablo is the singular doer; remove passive being but retain was cleaning."}, {"s": "Fix the verb: Before the manager returned, the host had been waited for a guest for twenty minutes. The host was doing the waiting.", "a": "Before the manager returned, the host had been waiting for a guest for twenty minutes.", "w": "Active duration before a past event requires had been waiting, not had been waited."}, {"s": "Name the school headword: An unexpected meeting changed a reporter's future forever. What adjective describes that meeting's important consequences?", "a": "fateful", "w": "Fateful describes an event with important effects on what happens later."}, {"s": "Choose by or until: The recording must be uploaded _____ eight tonight; eight is the latest completion time.", "a": "by", "w": "By expresses a completion deadline, unlike a continuing endpoint with until."}, {"s": "→PASSIVE: The engineer had replaced the damaged plug before the test began. Keep the doer and the earlier completion.", "a": "The damaged plug had been replaced by the engineer before the test began.", "w": "Keep past perfect; receiver needs had been replaced."}, {"s": "Can this become passive? The invited speakers arrived early.", "a": "No: arrived has no direct object in this sentence.", "w": "Arrival is intransitive here; do not invent were arrived."}, {"s": "The researcher found a box of rare interviews and said, 'We have struck gold!' What does strike gold mean here?", "a": "Achieve unexpected success or find something very valuable.", "w": "This is the figurative sense, not a claim that the box contained actual gold."}];let idx=0,score=0,miss=[],records=[];const $=x=>document.getElementById(x);const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function show(){if(idx===BANK.length){$('card').hidden=true;$('end').hidden=false;$('result').textContent='Correct '+score+'/'+BANK.length+' · Missed '+miss.length;$('review').innerHTML=records.map((r,i)=>'<div class="'+(r.ok?'':'miss')+'"><b>'+(i+1)+'. '+safe(r.s)+'</b><br>Your response: '+safe(r.your)+'<br>Correct answer: '+safe(r.a)+'<br>💡 '+safe(r.w)+'</div>').join('');return}$('progress').textContent='Item '+(idx+1)+'/'+BANK.length+' · Correct '+score;$('prompt').textContent=BANK[idx].s;$('typed').value='';$('feedback').hidden=true;$('mark').hidden=true;$('advance').hidden=true;$('reveal').hidden=false;$('typed').hidden=false}function reveal(){let q=BANK[idx];$('feedback').innerHTML='<b>Answer: '+safe(q.a)+'</b><br>💡 '+safe(q.w);$('feedback').hidden=false;$('reveal').hidden=true;$('mark').hidden=false}function mark(ok){if($('mark').hidden)return;let q=BANK[idx],your=$('typed').value.trim()||'Oral answer (not typed)';records.push({s:q.s,a:q.a,w:q.w,your,ok});if(ok)score++;else{miss.push(q);$('card').classList.remove('shake');void $('card').offsetWidth;$('card').classList.add('shake')}$('mark').hidden=true;$('typed').hidden=true;$('advance').hidden=false}function next(){idx++;show()}function reset(){idx=0;score=0;miss=[];records=[];$('card').hidden=false;$('end').hidden=true;show()}reset();</script></body></html>
