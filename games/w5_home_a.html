<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Beacon keeper · storm watch</title><style>*{box-sizing:border-box}body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:linear-gradient(145deg,#0c2440,#354d88);color:#eef6ff;margin:0;min-height:100vh}.wrap{max-width:680px;margin:auto;padding:20px 14px 40px}h1{font-size:clamp(24px,5vw,36px);margin:7px 0}p{line-height:1.5}.sub{color:#cddcff}.stage{text-align:center;font-size:50px;margin:14px 0;min-height:70px}.actor{display:inline-block;animation:bob 2s ease-in-out infinite}.actor.work{animation:work .6s ease-out}.actor.sleep{filter:grayscale(1);transform:rotate(22deg)}.beam{font-size:27px;display:inline-block;margin:0 12px}.beam.lit{animation:shine .7s ease-out}.card,.end{background:#fff;color:#1b2c4a;padding:22px;border-radius:18px;box-shadow:0 18px 38px #08182c66}.card.shake{animation:shake .35s}.prompt{font-size:clamp(19px,4.4vw,25px);font-weight:700;line-height:1.5;margin:16px 0}.progress{font-size:14px;color:#aee8ff;margin-bottom:12px}.feedback{background:#e9f4ff;border-left:5px solid #408ed0;border-radius:8px;padding:12px;margin:14px 0;animation:rise .25s}.bad{border-left-color:#dc6370;background:#ffedf0}.opt,button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;min-height:48px}button{background:#266dc3;color:white;font-weight:700}.opt{display:block;width:100%;text-align:left;background:#e7effa;color:#193258;margin:9px 0}.opt:hover{background:#cce3ff}.opt:disabled{opacity:.7;cursor:default}button:disabled{opacity:.5}.row{display:flex;gap:9px;flex-wrap:wrap}.yes{background:#188b64}.no{background:#c15058}.next{background:#664dba}.miss{background:#fff0f1;border-radius:8px;padding:9px;margin:8px 0;line-height:1.45}.review{max-height:340px;overflow:auto}.input{width:100%;min-height:45px;border:2px solid #a8bfdc;border-radius:8px;font:inherit;padding:8px;margin-bottom:10px}@keyframes bob{50%{transform:translateY(-6px)}}@keyframes work{50%{transform:scale(1.22) rotate(-8deg)}}@keyframes shine{50%{filter:drop-shadow(0 0 20px #ffe25d);transform:scale(1.5)}}@keyframes shake{25%,75%{transform:translateX(-7px)}50%{transform:translateX(7px)}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:480px){.card{padding:17px}.row button{flex:1}}</style><div class="wrap"><h1>Beacon keeper · storm watch</h1><p class="sub">屋企自願加練：選答案，守燈員點亮求救燈；3 命，錯咗即刻講解。</p><div class="stage"><span id="keeper" class="actor">🧑‍🚒</span><span class="beam" id="beam">🔦</span>🏫</div><div class="card" id="card"><div class="progress" id="progress"></div><div class="prompt" id="prompt"></div><div id="options"></div><div class="feedback" id="feedback" hidden></div><button class="next" id="advance" onclick="next()" hidden>下一個訊號 →</button></div><div class="end" id="end" hidden><h2 id="result"></h2><p>答啱 → 守燈員開燈；答錯 → 佢歇一歇、扣一命。3 命，題目每次洗牌。</p><h3>逐題報告 · 失誤標紅</h3><div class="review" id="report"></div><button onclick="restart()">重新守燈</button></div><p class="sub">G9 · Term 1 · Week 5 · Set A · local practice</p></div><script>const BANK=[{"s": "At that instant, the shelter doors ___ by two monitors, midway through their inspection.", "o": ["were being checked", "had been checked", "were checked"], "a": 0, "w": "Midway through means ongoing past; passive needs were being + V3."}, {"s": "The chalk marker slid ___ the window ledge and then stayed there.", "o": ["onto", "on", "toward"], "a": 0, "w": "Slid shows movement to the ledge surface: onto."}, {"s": "By the time the rain stopped, the emergency blankets ___ in sealed bags; packing had finished an hour earlier.", "o": ["had been stored", "were being stored", "store"], "a": 0, "w": "Packing finished earlier than the rain stopping; had been + V3."}, {"s": "The volunteer went ___ the blue curtain and appeared on its other side.", "o": ["through", "under", "toward"], "a": 0, "w": "Enter one side and exit the other = through."}, {"s": "Which sentence is already correct?", "o": ["The compass stayed on the wooden crate.", "The compass stayed onto the wooden crate.", "The compass were stayed on the wooden crate."], "a": 0, "w": "Stayed = stationary location, so on is correct; do not over-flag it."}, {"s": "After days of rain, the empty campsite felt ___, with soaked tents and dark skies.", "o": ["dismal", "prosperous", "glare"], "a": 0, "w": "Dismal means bleak and gloomy; prosperous means thriving, and glare is a noun or verb, not the adjective needed."}, {"s": "The wardens hurried ___ the rising stream, making the gap wider.", "o": ["away from", "through", "onto"], "a": 0, "w": "Gap widening = away from."}, {"s": "The repair-team trainee learning from an experienced electrician was an ___.", "o": ["apprentice", "convict", "hierarchy"], "a": 0, "w": "Apprentice means a trainee learning a skilled trade; convict is a person found guilty, hierarchy is a ranking system."}, {"s": "At that instant the drinking-water jars ___ into the storeroom, halfway across the room.", "o": ["were being moved", "had moved", "had been moved"], "a": 0, "w": "Halfway means past progress; passive jars = were being moved."}];let order=[],idx=0,lives=3,score=0,records=[];const $=x=>document.getElementById(x);const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function render(){if(idx>=order.length||lives<=0){finish();return}let q=order[idx];$('progress').textContent='訊號 '+(idx+1)+'/'+order.length+' · ❤ '+lives+' · 點亮 '+score;$('prompt').textContent=q.s;$('options').innerHTML=q.o.map((v,j)=>'<button class="opt" onclick="choose('+j+')">'+safe(v)+'</button>').join('');$('feedback').hidden=true;$('advance').hidden=true;$('card').classList.remove('shake')}function choose(j){let q=order[idx],ok=j===q.a;records.push({s:q.s,your:q.o[j],a:q.o[q.a],w:q.w,ok});if(ok){score++;$('keeper').classList.remove('work');void $('keeper').offsetWidth;$('keeper').classList.add('work');$('beam').classList.remove('lit');void $('beam').offsetWidth;$('beam').classList.add('lit')}else{lives--;$('keeper').classList.add('sleep');$('card').classList.add('shake')}document.querySelectorAll('.opt').forEach(b=>b.disabled=true);$('feedback').className='feedback'+(ok?'':' bad');$('feedback').innerHTML=(ok?'✅ Beacon lit! ':'❌ Beacon dim. ')+'<b>'+safe(q.o[q.a])+'</b><br>💡 '+safe(q.w);$('feedback').hidden=false;$('advance').hidden=false;$('advance').textContent=lives<=0?'看記錄 →':'下一個訊號 →'}function next(){idx++;$('keeper').classList.remove('sleep');render()}function finish(){$('card').hidden=true;$('end').hidden=false;$('result').textContent=lives<=0?'守燈員暫停：3 次失誤 · 點亮 '+score+'/'+order.length:'任務完成 · 點亮 '+score+'/'+order.length;$('report').innerHTML=records.map((r,i)=>'<div class="'+(r.ok?'':'miss')+'"><b>'+(i+1)+'. '+safe(r.s)+'</b><br>你揀：'+safe(r.your)+'<br>正解：'+safe(r.a)+'<br>💡 '+safe(r.w)+'</div>').join('')+(idx<order.length-1?'<p>餘下題目未作答；重試會洗牌。</p>':'')}function restart(){order=shuffle(BANK.slice());idx=0;lives=3;score=0;records=[];$('card').hidden=false;$('end').hidden=true;$('keeper').classList.remove('sleep');render()}restart();</script></html>
