<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ Game 2 — Switch 快問快答（堂上版）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, 'Helvetica Neue', sans-serif; background: linear-gradient(160deg, #0f172a, #1e1b4b 55%, #4c1d95); min-height: 100vh; color: #f8fafc; display: flex; justify-content: center; padding: 16px 14px 30px; }
  .wrap { width: 100%; max-width: 640px; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .head h1 { font-size: 20px; }
  .head .sub { font-size: 11.5px; opacity: .75; margin-top: 3px; }
  .restart { background: rgba(255,255,255,.12); border: 1.5px solid rgba(255,255,255,.35); color: #fff; border-radius: 10px; padding: 8px 15px; font-size: 12px; font-weight: 800; cursor: pointer; }
  .progress { display: flex; justify-content: space-between; font-size: 13px; font-weight: 900; color: #c4b5fd; margin-bottom: 10px; }
  .card { background: rgba(255,255,255,.98); color: #1e293b; border-radius: 18px; padding: 26px 22px; box-shadow: 0 10px 26px rgba(0,0,0,.4); }
  .task { display: inline-block; font-size: 15px; font-weight: 900; border-radius: 10px; padding: 7px 16px; margin-bottom: 16px; }
  .task.p { background: #ede9fe; color: #5b21b6; }
  .task.a { background: #dcfce7; color: #14532d; }
  .task.j { background: #fee2e2; color: #7f1d1d; }
  .sentence { font-size: 19px; font-weight: 800; line-height: 1.6; }
  .ansbox { margin-top: 18px; background: #f1f5f9; border-left: 5px solid #16a34a; border-radius: 10px; padding: 14px 16px; display: none; }
  .ansbox.show { display: block; }
  .ansbox .ans { font-size: 16px; font-weight: 900; color: #14532d; line-height: 1.55; }
  .ansbox .tip { font-size: 12.5px; color: #475569; line-height: 1.65; margin-top: 7px; }
  .big { width: 100%; border: 0; border-radius: 13px; padding: 15px 0; font-size: 16.5px; font-weight: 900; cursor: pointer; margin-top: 18px; }
  .reveal-btn { background: linear-gradient(135deg, #7c3aed, #db2777); color: #fff; }
  .markrow { display: none; gap: 12px; margin-top: 16px; }
  .markrow.show { display: flex; }
  .mk { flex: 1; border: 0; border-radius: 13px; padding: 15px 0; font-size: 16px; font-weight: 900; cursor: pointer; }
  .mk.yes { background: #dcfce7; color: #14532d; border: 2.5px solid #16a34a; }
  .mk.no { background: #fee2e2; color: #7f1d1d; border: 2.5px solid #dc2626; }
  .endcard { background: rgba(255,255,255,.98); color: #1e293b; border-radius: 18px; padding: 30px 24px; text-align: center; display: none; }
  .endcard.show { display: block; }
  .endcard .big-score { font-size: 44px; font-weight: 900; color: #4c1d95; margin: 10px 0 4px; }
  .endcard .verdict { font-size: 14px; font-weight: 800; color: #64748b; margin-bottom: 16px; }
  .missed { text-align: left; background: #fef2f2; border: 2px solid #fecaca; border-radius: 12px; padding: 13px 15px; margin-top: 8px; display: none; }
  .missed.show { display: block; }
  .missed h3 { font-size: 12.5px; color: #991b1b; margin-bottom: 8px; }
  .missed .m { font-size: 12px; color: #44403c; line-height: 1.65; padding: 6px 0; border-top: 1px dashed #fecaca; }
  .missed .m b { color: #14532d; }
  .again { background: linear-gradient(135deg, #7c3aed, #db2777); color: #fff; border: 0; border-radius: 13px; padding: 15px 40px; font-size: 16px; font-weight: 900; cursor: pointer; margin-top: 20px; }
  .foot { text-align: center; font-size: 10.5px; color: #a5b4fc; margin-top: 14px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>⚡ Switch 快問快答</h1>
      <div class="sub">睇句子 → 講出答案 → 揭答案 → 撳 ✅ / ❌</div>
    </div>
    <button class="restart" onclick="restart()">🔄 重新開始</button>
  </div>

  <div class="progress" id="progress"></div>

  <div class="card" id="qcard">
    <span class="task" id="taskChip"></span>
    <div class="sentence" id="sentence"></div>
    <div class="ansbox" id="ansbox">
      <div class="ans" id="ans"></div>
      <div class="tip" id="tip"></div>
    </div>
    <button class="big reveal-btn" id="revealBtn" onclick="reveal()">👀 揭答案</button>
    <div class="markrow" id="markrow">
      <button class="mk yes" onclick="mark(true)">✅ 啱</button>
      <button class="mk no" onclick="mark(false)">❌ 錯</button>
    </div>
  </div>

  <div class="endcard" id="endcard">
    <div style="font-size:15px;font-weight:900;">🏁 完成了！</div>
    <div class="big-score" id="finalScore"></div>
    <div class="verdict" id="verdict"></div>
    <div class="missed" id="missed">
      <h3>📝 溫吓呢啲 — 啱完整答案：</h3>
      <div id="missedList"></div>
    </div>
    <button class="again" onclick="restart()">⚡ 再玩一次</button>
  </div>

  <div class="foot">Onion 堂上用 · 12 條題目（→被動 / →主動 / 啱定錯 輪住嚟）· 全部新句子，同功課 Part B/D 同設計</div>
</div>

<script>
var CARDS = [
  { m: "P", s: "Mum waters the plants every evening.", ans: "The plants are watered by mum every evening.", tip: "plants = 眾數 → be 用 are。water→watered V3。mum 落 by-phrase。" },
  { m: "A", s: "The window was broken by the boys.", ans: "The boys broke the window.", tip: "刪走 was，時態搬返落 verb：break → broke（過去被動 ↔ 過去主動 = V2）。" },
  { m: "J", s: "The thief was arrested by the police last night.", ans: "✔ 啱 — 正確嘅過去被動", tip: "receiver 主語（thief）+ was + V3 (arrested) + by-phrase，全部啱晒。" },
  { m: "P", s: "The students cleaned the classroom after school.", ans: "The classroom was cleaned by the students after school.", tip: "classroom 做主語。過去被動 = was cleaned。clean 係規則動詞，V3 = V+ed。" },
  { m: "A", s: "Rice is grown in this village.", ans: "People grow rice in this village.", tip: "冇 by-phrase → 補 doer（people / villagers）。rice 轉做 object。people 眾數 → grow 冇 s！" },
  { m: "J", s: "We were enjoyed the party very much.", ans: "✘ 錯 — 多餘 be", tip: "We 係 doer → 一定要 active：We enjoyed the party very much.（enjoy 有 object，doer 主語唔可以用被動）" },
  { m: "P", s: "Somebody took Charles's umbrella by mistake.", ans: "Charles's umbrella was taken by mistake.", tip: "umbrella 做主語。Somebody 喺被動句會消失。take → taken V3。" },
  { m: "A", s: "The email has been sent by Mr. Chan.", ans: "Mr. Chan has sent the email.", tip: "perfect 被動 → perfect 主動。has been sent → has sent（have/has + V3）。tense 住喺 has 度，唔可以跌。" },
  { m: "J", s: "The train was arrived at platform two at 9 a.m.", ans: "✘ 錯 — 不及物動詞", tip: "arrive 冇 object → 永遠冇被動！正確：The train arrived at platform two…（-it test：arrive it? ✗）" },
  { m: "P", s: "The inspector was testing the students during lunch break.", ans: "The students were being tested by the inspector during lunch break.", tip: "過去進行被動 = was/were being + V3。8月15號佢寫過 was tested 欠 being — 今次要殺咗佢。SVA：students → were。" },
  { m: "A", s: "The new swimming pool will be opened next month.", ans: "They will open the new swimming pool next month.", tip: "刪 be 之後 tense 留喺 will 度 → will + 原形 open。冇 agent → 補 they / people / the government。" },
  { m: "J", s: "The medicines are tested by scientists every year.", ans: "✔ 啱 — 包括 SVA（medicines 眾數 → are）", tip: "呢句完全正確。講唔得出邊度錯 = 就係冇錯！" }
];
var TASK = { P: "→ 轉做 PASSIVE 被動", A: "→ 轉做 ACTIVE 主動", J: "啱定錯？✔ / ✘" };
var TCLS = { P: "p", A: "a", J: "j" };
var i = 0, score = 0, results = [];

function restart() {
  i = 0; score = 0; results = [];
  document.getElementById('endcard').classList.remove('show');
  document.getElementById('qcard').style.display = 'block';
  showQ();
}
function showQ() {
  var c = CARDS[i];
  document.getElementById('progress').textContent = '第 ' + (i + 1) + ' / ' + CARDS.length + ' 題 · ✅ ' + score;
  var chip = document.getElementById('taskChip');
  chip.textContent = TASK[c.m];
  chip.className = 'task ' + TCLS[c.m];
  document.getElementById('sentence').textContent = c.s;
  document.getElementById('ansbox').classList.remove('show');
  document.getElementById('revealBtn').style.display = 'block';
  document.getElementById('markrow').classList.remove('show');
}
function reveal() {
  var c = CARDS[i];
  document.getElementById('ans').textContent = c.ans;
  document.getElementById('tip').textContent = '💡 ' + c.tip;
  document.getElementById('ansbox').classList.add('show');
  document.getElementById('revealBtn').style.display = 'none';
  document.getElementById('markrow').classList.add('show');
}
function mark(got) {
  results.push({ q: i + 1, got: got, card: CARDS[i] });
  if (got) { score++; }
  if (i < CARDS.length - 1) { i++; showQ(); } else { finish(); }
}
function finish() {
  document.getElementById('qcard').style.display = 'none';
  document.getElementById('progress').textContent = '';
  document.getElementById('finalScore').textContent = score + ' / ' + CARDS.length;
  var missed = results.filter(function(r) { return !r.got; });
  document.getElementById('verdict').textContent = score >= 10 ? '🌟 勁！可以挑戰更難嘅句子' : score >= 7 ? '👍 唔錯 — 錯嗰幾條望清楚先' : '💪 再嚟一次 — 慢慢嚟，記住 be + V3！';
  var missEl = document.getElementById('missed');
  if (missed.length) {
    var h = '';
    missed.forEach(function(r) {
      h += '<div class="m">第 ' + r.q + ' 題 · ' + r.card.s + '<br><b>答案：' + r.card.ans + '</b></div>';
    });
    document.getElementById('missedList').innerHTML = h;
    missEl.classList.add('show');
  } else {
    missEl.classList.remove('show');
  }
  document.getElementById('endcard').classList.add('show');
}
restart();
</script>
</body>
</html>
