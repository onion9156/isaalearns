<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky Switch</title><style>*{box-sizing:border-box}body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:linear-gradient(145deg,#0c2440,#354d88);color:#eef6ff;margin:0;min-height:100vh}.wrap{max-width:680px;margin:auto;padding:20px 14px 40px}h1{font-size:clamp(24px,5vw,36px);margin:7px 0}p{line-height:1.5}.sub{color:#cddcff}.stage{text-align:center;font-size:50px;margin:14px 0;min-height:70px}.actor{display:inline-block;animation:bob 2s ease-in-out infinite}.actor.work{animation:work .6s ease-out}.actor.sleep{filter:grayscale(1);transform:rotate(22deg)}.beam{font-size:27px;display:inline-block;margin:0 12px}.beam.lit{animation:shine .7s ease-out}.card,.end{background:#fff;color:#1b2c4a;padding:22px;border-radius:18px;box-shadow:0 18px 38px #08182c66}.card.shake{animation:shake .35s}.prompt{font-size:clamp(19px,4.4vw,25px);font-weight:700;line-height:1.5;margin:16px 0}.progress{font-size:14px;color:#aee8ff;margin-bottom:12px}.feedback{background:#e9f4ff;border-left:5px solid #408ed0;border-radius:8px;padding:12px;margin:14px 0;animation:rise .25s}.bad{border-left-color:#dc6370;background:#ffedf0}.opt,button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;min-height:48px}button{background:#266dc3;color:white;font-weight:700}.opt{display:block;width:100%;text-align:left;background:#e7effa;color:#193258;margin:9px 0}.opt:hover{background:#cce3ff}.opt:disabled{opacity:.7;cursor:default}button:disabled{opacity:.5}.row{display:flex;gap:9px;flex-wrap:wrap}.yes{background:#188b64}.no{background:#c15058}.next{background:#664dba}.miss{background:#fff0f1;border-radius:8px;padding:9px;margin:8px 0;line-height:1.45}.review{max-height:340px;overflow:auto}.input{width:100%;min-height:45px;border:2px solid #a8bfdc;border-radius:8px;font:inherit;padding:8px;margin-bottom:10px}@keyframes bob{50%{transform:translateY(-6px)}}@keyframes work{50%{transform:scale(1.22) rotate(-8deg)}}@keyframes shine{50%{filter:drop-shadow(0 0 20px #ffe25d);transform:scale(1.5)}}@keyframes shake{25%,75%{transform:translateX(-7px)}50%{transform:translateX(7px)}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:480px){.card{padding:17px}.row button{flex:1}}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}</style></head><body><div class="wrap"><h1>Sky Switch · W6 Set B</h1><p class="sub">In class: say your answer → reveal the rule → self-mark → next. Typed answers are optional.</p><div class="stage">🔭 <span class="actor">🧑‍🎓</span> 🌤️</div><div class="card" id="card"><div class="progress" id="progress"></div><div class="prompt" id="prompt"></div><label for="typed">Optional written response</label><input class="input" id="typed" aria-label="Optional written answer"><div><button id="reveal" onclick="reveal()">Reveal answer + why</button></div><div class="feedback" id="feedback" hidden></div><div class="row" id="mark" hidden><button class="yes" onclick="mark(true)">Correct</button><button class="no" onclick="mark(false)">Needs practice</button></div><button class="next" id="advance" onclick="next()" hidden>Next →</button></div><div class="end" id="end" hidden><h2 id="result"></h2><h3>Every attempted item · mistakes highlighted</h3><div class="review" id="review"></div><button onclick="reset()">Restart</button></div><p class="sub">G9 · Term 1 · Week 6 · Set B · Local practice, not a school-quiz result</p></div><script>const BANK=[{"s": "Keep or fix: The old telescope mount is conventional but reliable.", "a": "Leave it: The old telescope mount is conventional but reliable.", "w": "Conventional is an adjective describing the mount after is. A correct linking-verb sentence does not need an adverb or an extra passive verb."}, {"s": "→PASSIVE: The technician was aligning the mirrors at midnight. Keep the doer and the ongoing aspect.", "a": "The mirrors were being aligned by the technician at midnight.", "w": "Mirrors is plural and receives an ongoing past action: were being aligned. Were aligned would lose the continuous aspect."}, {"s": "Complete with one focus root: After their noisy arrival, the guests need to _____ and become quiet before entering the dome. Use the base phrase.", "a": "settle down", "w": "Settle down can mean become calm. After need to, use the base phrase; this context is about calming down, not establishing a permanent home."}, {"s": "→ACTIVE: The comet image has been labelled by Priya this afternoon. Keep the tense, doer and time.", "a": "Priya has labelled the comet image this afternoon.", "w": "Priya is the doer. Present perfect active is has labelled: remove passive been without changing the tense to past simple."}, {"s": "Keep or fix: Before the power failed, Eli had been analysed cloud data for ninety minutes. Eli was doing the analysis throughout that period.", "a": "Before the power failed, Eli had been analysing cloud data for ninety minutes.", "w": "Trap: had been does not automatically mean passive. Eli is the doer of a continuing action before another past event, so use active had been analysing."}, {"s": "An expert gardener visiting the observatory cannot read or write and chooses a spoken weather guide. Which focus adjective describes that reading-and-writing difficulty, not the visitor's intelligence?", "a": "illiterate", "w": "Illiterate means unable to read or write. A person may have substantial expertise and knowledge while being illiterate; spoken information supports access."}, {"s": "Choose by or until: Cloud monitoring will continue _____ 2 a.m.; it will stop at that time.", "a": "until", "w": "The monitoring continues up to an endpoint. Until marks that endpoint; by would set a latest completion deadline."}, {"s": "Use grasp in the present perfect active: Milo _____ the meaning of the warning colours, so he can explain them to a new visitor now.", "a": "has grasped", "w": "Grasp means understand here. Has grasped expresses a completed change with a current result, and Milo is the doer."}, {"s": "→PASSIVE if possible; otherwise explain why not: Visitors ventured outside after the clouds cleared.", "a": "No passive is possible here: ventured outside has no direct object.", "w": "Trap: outside is an adverb of place, not an object receiving the action. Venture is intransitive in this sentence, so there is no object to become a passive subject."}, {"s": "Historical weather diaries describe slums as neighbourhoods with inadequate housing and services. Complete with a focus phrase: After the flood, some residents needed deliveries because they could not _____ themselves. Use the base phrase after could not.", "a": "fend for", "w": "Fend for themselves means provide what they need without help. The flood explains the temporary need for assistance; living in slums does not itself imply inability."}];let idx=0,score=0,miss=[],records=[];const $=x=>document.getElementById(x);const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function show(){if(idx===BANK.length){$('card').hidden=true;$('end').hidden=false;$('result').textContent='Correct '+score+'/'+BANK.length+' · Missed '+miss.length;$('review').innerHTML=records.map((r,i)=>'<div class="'+(r.ok?'':'miss')+'"><b>'+(i+1)+'. '+safe(r.s)+'</b><br>Your response: '+safe(r.your)+'<br>Correct answer: '+safe(r.a)+'<br>💡 '+safe(r.w)+'</div>').join('');return}$('progress').textContent='Item '+(idx+1)+'/'+BANK.length+' · Correct '+score;$('prompt').textContent=BANK[idx].s;$('typed').value='';$('feedback').hidden=true;$('mark').hidden=true;$('advance').hidden=true;$('reveal').hidden=false;$('typed').hidden=false}function reveal(){let q=BANK[idx];$('feedback').innerHTML='<b>Answer: '+safe(q.a)+'</b><br>💡 '+safe(q.w);$('feedback').hidden=false;$('reveal').hidden=true;$('mark').hidden=false}function mark(ok){if($('mark').hidden)return;let q=BANK[idx],your=$('typed').value.trim()||'Oral answer (not typed)';records.push({s:q.s,a:q.a,w:q.w,your,ok});if(ok)score++;else{miss.push(q);$('card').classList.remove('shake');void $('card').offsetWidth;$('card').classList.add('shake')}$('mark').hidden=true;$('typed').hidden=true;$('advance').hidden=false}function next(){idx++;show()}function reset(){idx=0;score=0;miss=[];records=[];$('card').hidden=false;$('end').hidden=true;show()}reset();</script></body></html>
