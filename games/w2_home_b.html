<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>時光快遞員 — W2 Set B 屋企</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, 'Helvetica Neue', sans-serif; background: linear-gradient(160deg, #0f172a, #1e1b4b 55%, #312e81); min-height: 100vh; color: #f8fafc; display: flex; justify-content: center; padding: 16px 14px 30px; }
  .wrap { width: 100%; max-width: 620px; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .head h1 { font-size: 20px; }
  .head .sub { font-size: 11.5px; opacity: .75; margin-top: 3px; }
  .restart { background: rgba(255,255,255,.12); border: 1.5px solid rgba(255,255,255,.35); color: #fff; border-radius: 10px; padding: 8px 15px; font-size: 12px; font-weight: 800; cursor: pointer; }
  .progress { display: flex; justify-content: space-between; font-size: 13px; font-weight: 900; color: #c4b5fd; margin-bottom: 10px; }
  .card { background: rgba(255,255,255,.98); color: #1e293b; border-radius: 18px; padding: 26px 22px; box-shadow: 0 10px 26px rgba(0,0,0,.4); }
  .sentence { font-size: 18.5px; font-weight: 800; line-height: 1.6; }
  .fb { margin-top: 14px; background: #f1f5f9; border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.65; display: none; }
  .fb.show { display: block; }
  .fb.good { background: #dcfce7; }
  .fb.bad { background: #fee2e2; }
  .big { width: 100%; border: 0; border-radius: 13px; padding: 15px 0; font-size: 16px; font-weight: 900; cursor: pointer; margin-top: 16px; }
  .nxt { display: none; }
  .nxt.show { display: block; }
  .choice-row { display: flex; flex-direction: column; gap: 11px; margin-top: 18px; }
  .opt { border: 2.5px solid #cbd5e1; background: #f8fafc; color: #1e293b; border-radius: 13px; padding: 15px 14px; font-size: 16px; font-weight: 900; cursor: pointer; text-align: left; }
  .opt:hover { border-color: #7c3aed; }
  .opt.right { border-color: #16a34a; background: #dcfce7; }
  .opt.wrong { border-color: #dc2626; background: #fee2e2; }
  .hearts { font-size: 15px; }
  .endcard { background: rgba(255,255,255,.98); color: #1e293b; border-radius: 18px; padding: 30px 24px; text-align: center; display: none; }
  .endcard.show { display: block; }
  .big-score { font-size: 44px; font-weight: 900; color: #4c1d95; margin: 10px 0 4px; }
  .verdict { font-size: 14px; font-weight: 800; color: #64748b; margin-bottom: 16px; }
  .missed { text-align: left; background: #fef2f2; border: 2px solid #fecaca; border-radius: 12px; padding: 13px 15px; margin-top: 8px; display: none; }
  .missed.show { display: block; }
  .missed h3 { font-size: 12.5px; color: #991b1b; margin-bottom: 8px; }
  .missed .m { font-size: 12px; color: #44403c; line-height: 1.65; padding: 6px 0; border-top: 1px dashed #fecaca; }
  .missed .m b { color: #14532d; }
  .again { background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; border: 0; border-radius: 13px; padding: 15px 40px; font-size: 16px; font-weight: 900; cursor: pointer; margin-top: 20px; }
  .foot { text-align: center; font-size: 10.5px; color: #a5b4fc; margin-top: 14px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div>
      <h1>時光快遞員 · W2</h1>
      <div class="sub">揀啲正確 form，準時送達 — 3 件包裹爛咗就收工！</div>
    </div>
    <span class="hearts" id="hearts"></span>
  </div>
  <div class="progress" id="progress"></div>
  <div class="card" id="qcard">
    <div class="sentence" id="qtext"></div>
    <div class="choice-row" id="opts"></div>
    <div class="fb" id="fb"></div>
    <button class="big nxt" id="nxt" onclick="next()" style="background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;"></button>
  </div>
  <div class="endcard" id="endcard">
    <div style="font-size:15px;font-weight:900;">🏁 完成了！</div>
    <div class="big-score" id="finalScore"></div>
    <div class="verdict" id="verdict"></div>
    <div class="missed" id="missed"><h3>溫吓呢啲：</h3><div id="missedList"></div></div>
    <button class="again" onclick="restart()">⚡ 再玩一次</button>
  </div>
  <div class="foot">W2 Set B 屋企遊戲 · 10 回合 · 每局洗牌 · by 蝦蝦 🦐</div>

</div>
<script>

var BANK = [
  { s: "Mum has been ___ dinner since 5 p.m.", o: ["cook", "cooking"], a: 1, w: "been + V-ing：been cooking。隻 verb 著 V-ing 衫。" },
  { s: "Dad has already ___ the dishwasher.", o: ["loaded", "loading"], a: 0, w: "has + V3：loaded。already 陪 Simple。" },
  { s: "They have ___ each other for ten years. (know)", o: ["known", "been knowing"], a: 0, w: "know 係狀態動詞 — 冇 loading 條 → Simple。" },
  { s: "I have ___ my keys — 而家開唔到門！", o: ["lost", "been losing"], a: 0, w: "鎖匙唔見咗 = 現在結果 → Simple。" },
  { s: "We have ___ for the bus for 25 minutes.", o: ["waited", "been waiting"], a: 1, w: "for 25 minutes 仲等緊 → been waiting。" },
  { s: "She has ___ three letters to her pen pal.", o: ["wrote", "written"], a: 1, w: "V3 著衫：write→written。" },
  { s: "The printer has ___ paper all morning.", o: ["eaten", "been eating"], a: 1, w: "all morning 一直食紙（壞咗）→ been eating。" },
  { s: "Grandpa has ___ this radio since 1980.", o: ["had", "been having"], a: 0, w: "have(擁有) 狀態動詞 → Simple。" },
  { s: "Look! The delivery man has ___ our parcel!", o: ["brought", "brung"], a: 0, w: "bring→brought V3。" },
  { s: "They have ___ that old car since March — 幾時先整好啊？", o: ["repaired", "been repairing"], a: 1, w: "since March 仲整緊 → been repairing。" }
];

var i = 0, score = 0, lives = 3, results = [];
function $(id){ return document.getElementById(id); }
function shuffle(a){ for (var k = a.length - 1; k > 0; k--){ var j = Math.floor(Math.random() * (k + 1)); var t = a[k]; a[k] = a[j]; a[j] = t; } return a; }
function restart(){
  order = shuffle(BANK.map(function(_, n){ return n; }));
  i = 0; score = 0; lives = 3; results = [];
  $('endcard').classList.remove('show');
  $('qcard').style.display = 'block';
  showQ();
}
function showQ(){
  var c = BANK[order[i]];
  $('progress').textContent = progressLabel();
  $('qtext').textContent = c.s;
  var opts = $('opts'); opts.innerHTML = '';
  c.o.forEach(function(txt, n){
    var b = document.createElement('button');
    b.className = 'opt'; b.textContent = txt;
    b.onclick = function(){ pick(n, b); };
    opts.appendChild(b);
  });
  $('fb').className = 'fb'; $('fb').innerHTML = '';
  $('nxt').classList.remove('show');
}
function pick(n, btn){
  var c = BANK[order[i]];
  var good = n === c.a;
  results.push({ q: i+1, got: good, card: c });
  var btns = $('opts').children;
  for (var k = 0; k < btns.length; k++){ btns[k].disabled = true; }
  btns[c.a].classList.add('right');
  if (!good){ btn.classList.add('wrong'); lives--; }
  else { score++; }
  var fb = $('fb');
  fb.className = 'fb show ' + (good ? 'good' : 'bad');
  fb.innerHTML = (good ? goodMsg() : badMsg()) + ' ' + c.w;
  setHearts();
  $('nxt').classList.add('show');
  $('nxt').textContent = nextLabel();
}
function next(){
  if (lives <= 0 || i >= BANK.length - 1){ finish(); return; }
  i++; showQ();
}
function finish(){
  $('verdict').textContent = verdictLine();
  $('qcard').style.display = 'none';
  $('progress').textContent = '';
  $('finalScore').textContent = score + ' / ' + BANK.length;
  var missed = results.filter(function(r){ return !r.got; });
  var mEl = $('missed');
  if (missed.length){
    var h = '';
    missed.forEach(function(r){
      h += '<div class="m">' + r.card.s + '<br><b>' + r.card.o[r.card.a] + '</b> — ' + r.card.w + '</div>';
    });
    $('missedList').innerHTML = h;
    mEl.classList.add('show');
  } else { mEl.classList.remove('show'); }
  $('endcard').classList.add('show');
}

var HEART = '📦'; var HEART_FULL = '📦'; var HEART_EMPTY = '💥';
var GOOD = '✅ 準時送到！'; var BAD = '❌ 包裹撞爛咗 —'; var NEXT = '下一件包裹 ▶'; var FINISH_LBL = '交更 🏁';

function progressLabel(){ return (i+1) + ' / ' + BANK.length + ' · score ' + score; }
function setHearts(){ $('hearts').textContent = HEART_FULL.repeat(Math.max(lives,0)) + HEART_EMPTY.repeat(3 - Math.max(lives,0)); }
function goodMsg(){ return GOOD; }
function badMsg(){ return BAD; }
function nextLabel(){ return (i < BANK.length - 1 && lives > 0) ? NEXT : FINISH_LBL; }
function verdictLine(){
  if (lives <= 0) return '📦 三件包裹都爛咗 — 睇完答案再跑一轉！';
  if (score >= 9) return '🌟 金牌快遞員！';
  if (score >= 7) return '👍 唔錯 — 睇吓邊件送錯';
  return '💪 明日再嚟 — 記住 V3 著衫 + been V-ing';
}
document.getElementById('hearts').textContent = HEART_FULL.repeat(3);

</script>
</body>
</html>
