<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔄 Switch Boss · 轉換王爭霸戰</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', 'Microsoft JhengHei', system-ui, sans-serif; background: linear-gradient(160deg,#0f172a,#1e3a8a 60%,#7c2d12); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; color: #fff; }
.app { width: 100%; max-width: 580px; }
.hud { display: flex; gap: 8px; margin-bottom: 12px; }
.chip { background: rgba(255,255,255,.12); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 700; }
.chip.streak { background: #f59e0b; color: #1e1b4b; }
.bar { height: 8px; background: rgba(255,255,255,.15); border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg,#fbbf24,#f97316); width: 0%; transition: width .3s; }
.card { background: #fff; color: #1e1b4b; border-radius: 18px; padding: 24px 20px; box-shadow: 0 12px 40px rgba(0,0,0,.4); text-align: center; }
.dir { display: inline-block; font-size: 15px; font-weight: 900; padding: 6px 18px; border-radius: 999px; margin-bottom: 12px; color: #fff; }
.dir.p { background: #7c3aed; } .dir.a { background: #0891b2; } .dir.j { background: #d97706; }
.sentence { font-size: 20px; line-height: 1.5; font-weight: 600; margin-bottom: 16px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { border: 2px solid #cbd5e1; background: #f8fafc; border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.45; cursor: pointer; text-align: left; font-weight: 600; color: #1e1b4b; transition: border-color .15s, background .15s; font-family: inherit; }
.opt:active { transform: scale(.98); }
.opt.dim { opacity: .45; }
.opt.good { border-color: #059669; background: #d1fae5; }
.opt.bad { border-color: #e11d48; background: #fee2e2; }
.fb { margin-top: 16px; border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.55; text-align: left; display: none; }
.fb.ok { display: block; background: #d1fae5; color: #065f46; }
.fb.no { display: block; background: #fee2e2; color: #991b1b; }
.next { margin-top: 14px; background: #4f46e5; border: none; color: #fff; font-size: 15px; font-weight: 800; padding: 12px 28px; border-radius: 12px; cursor: pointer; display: none; font-family: inherit; }
.end-title { font-size: 26px; font-weight: 900; margin-bottom: 8px; }
.score-big { font-size: 52px; font-weight: 900; background: linear-gradient(90deg,#fbbf24,#f97316); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stats { margin: 14px 0; text-align: left; font-size: 14px; line-height: 1.7; background: #fff7ed; border-radius: 12px; padding: 12px 16px; color: #7c2d12; }
.shot { font-size: 15px; font-weight: 800; color: #b45309; margin: 10px 0; }
.again { background: #4f46e5; border: none; color: #fff; font-size: 15px; font-weight: 800; padding: 12px 32px; border-radius: 12px; cursor: pointer; font-family: inherit; }
.title-screen h1 { font-size: 30px; font-weight: 900; margin-bottom: 6px; }
.title-screen p { font-size: 15px; line-height: 1.6; margin-bottom: 10px; }
.hide { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <div class="chip">⭐ Score: <span id="score">0</span>/<span id="total">10</span></div>
    <div class="chip streak">🔥 Streak: <span id="streak">0</span></div>
    <div class="chip">🏆 Best: <span id="best">–</span></div>
  </div>
  <div class="bar"><i id="bar"></i></div>

  <div class="card title-screen" id="title">
    <h1>🔄 Switch Boss</h1>
    <p><b>轉換王爭霸戰</b><br>Isaac × 蝦蝦 · →PASSIVE / →ACTIVE 轉換訓練</p>
    <p style="text-align:left">跟住箭嘴方向轉換句子。<b>每一題都係新一局</b> — 方向會轉，先判斷，先落筆！<br>小心三個陷阱：<b>漏 be</b> · <b>多 be</b> · <b>V2 冒充 V3</b>。<br>10 題一 round，答完有逐個解解釋。</p>
    <button class="again" onclick="start()">挑戰 Boss ▶</button>
  </div>

  <div class="card hide" id="quiz">
    <div id="qno" style="font-size:12px;font-weight:700;color:#7c3aed;letter-spacing:1px;margin-bottom:8px;"></div>
    <div><span class="dir" id="dir"></span></div>
    <div class="sentence" id="sentence"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <button class="next" id="next" onclick="nextQ()">下一題 ▶</button>
  </div>

  <div class="card hide" id="end">
    <div class="end-title">🏆 Boss 戰完！</div>
    <div class="score-big" id="finalScore"></div>
    <div class="stats" id="finalStats"></div>
    <div class="shot">📷 Screenshot 呢一頁 send 俾蝦蝦！</div>
    <button class="again" onclick="location.reload()">再挑戰 🔄</button>
  </div>
</div>

<script>
const Q = [
 {dir:"→ PASSIVE", s:"The chef prepares fresh sushi every morning.", opts:[
   {t:"Fresh sushi prepares by the chef every morning.", ok:false, w:"漏咗 be！passive 一定要 be + V3 — prepares 前面欠 is。"},
   {t:"Fresh sushi is prepared by the chef every morning.", ok:true, w:"✅ receiver 做 subject + is + V3 + by doer，齊晒。"},
   {t:"Fresh sushi is prepare by the chef every morning.", ok:false, w:"be 之後要 V3：prepared — prepare 係 V1，入唔到 be 嘅門。"}]},
 {dir:"→ ACTIVE", s:"The suspect was questioned by the police for two hours.", opts:[
   {t:"The police was questioned the suspect for two hours.", ok:false, w:"多餘 be + SVA 錯。active 就唔要 be：questioned。"},
   {t:"The police questioned the suspect for two hours.", ok:true, w:"✅ doer 做 subject，刪 be 還原 V2：questioned。"},
   {t:"The suspect questioned the police for two hours.", ok:false, w:"主語調轉咗，意思變咗 — 警方問疑犯，唔係疑犯問警方！"}]},
 {dir:"→ PASSIVE", s:"Somebody stole Charles's bike last Friday.", opts:[
   {t:"Charles's bike was stolen last Friday.", ok:true, w:"✅ was + stolen(V3)。Somebody 唔重要時可以唔寫 by-phrase。"},
   {t:"Charles's bike was stole last Friday.", ok:false, w:"stole 係 V2 — be 嘅門只收 V3：stolen。"},
   {t:"Charles's bike stolen by somebody last Friday.", ok:false, w:"漏咗 be：bike 後面要有 <b>was</b> stolen。"}]},
 {dir:"→ PASSIVE", s:"They will open the new swimming pool next month.", opts:[
   {t:"The new swimming pool will opened next month.", ok:false, w:"will 後面漏 be — future passive 係 will BE + V3。"},
   {t:"The new swimming pool is opened next month.", ok:false, w:"tense 轉咗 — 原句係 future（will），唔係 present。"},
   {t:"The new swimming pool will be opened next month.", ok:true, w:"✅ will be + opened — be 唔可以偷懶唔見。"}]},
 {dir:"→ ACTIVE", s:"The letters have been sent by the secretary already.", opts:[
   {t:"The secretary has sent the letters already.", ok:true, w:"✅ doer 做 subject：has + sent(V3)。Boss 題都冇有怕。"},
   {t:"The secretary have sent the letters already.", ok:false, w:"SVA：secretary 單數 → has，唔係 have。"},
   {t:"The secretary has send the letters already.", ok:false, w:"has 之後要 V3：sent — send 係 V1。"}]},
 {dir:"→ PASSIVE", s:"People grow rice in this village.", opts:[
   {t:"Rice is grown in this village.", ok:true, w:"✅ is + grown(V3)。grow → grew → grown。"},
   {t:"Rice is grew in this village.", ok:false, w:"grew 係 V2 — be 嘅門只收 V3：grown。"},
   {t:"Rice grows in this village.", ok:false, w:"呢句係 active（rice 自己種自己？）— 欠咗 be：is grown。"}]},
 {dir:"→ ACTIVE", s:"Charles was hit by a ball during the game.", opts:[
   {t:"A ball was hit Charles during the game.", ok:false, w:"多餘 be！active 唔要 be：hit。"},
   {t:"Charles hit a ball during the game.", ok:false, w:"方向反咗 — 係波打 Charles，唔係 Charles 打波！"},
   {t:"A ball hit Charles during the game.", ok:true, w:"✅ doer（a ball）做 subject，還原 V2：hit。"}]},
 {dir:"JUDGE ✔ / ✘", s:"The homework must be finished tonight.", opts:[
   {t:"✘ 錯 — must 後面應該係 must finished", ok:false, w:"modal passive 三連：must + BE + V3。刪走 be 先係錯！"},
   {t:"✔ 啱 — modal + be + V3 完全正確", ok:true, w:"✅ must be finished：modal + be + V3，教科書級 passive。"},
   {t:"✘ 錯 — homework 應該用 were", ok:false, w:"homework 係 uncountable（永遠單數）— 就算變 past 都係 was，何況呢句用 must be。"}]},
 {dir:"JUDGE ✔ / ✘", s:"The bus was arrived at 8 a.m. yesterday.", opts:[
   {t:"✘ 錯 — 刪 was：The bus arrived at 8 a.m.", ok:true, w:"✅ arrive 冇 receiver（唔係嘢俾人 arrive）→ 永遠 active。be 係多餘。"},
   {t:"✔ 啱 — past passive 正確", ok:false, w:"中伏！arrive 後面冇嘢承接動作 — 冇 receiver 就冇 passive。"},
   {t:"✘ 錯 — 應該改做 was arriving", ok:false, w:"問題唔係 tense，係 voice：arrive 根本入唔到被動門。"}]},
 {dir:"→ PASSIVE", s:"The government repairs the road each summer.", opts:[
   {t:"The road repairs by the government each summer.", ok:false, w:"經典 autopilot 陷阱 — 漏 be！係 is repaired，唔係 repairs。"},
   {t:"The road is repair by the government each summer.", ok:false, w:"be 之後要 V3：repaired。"},
   {t:"The road is repaired by the government each summer.", ok:true, w:"✅ is + repaired(V3) + by doer — 完美。"}]}
];
const DIRCLASS = {"→ PASSIVE":"p","→ ACTIVE":"a","JUDGE ✔ / ✘":"j"};
let deck=[], i=0, score=0, streak=0, bestStreak=0, missP=0, missA=0, missJ=0, locked=false;
function shuffle(x){ for(let j=x.length-1;j>0;j--){ const k=Math.floor(Math.random()*(j+1)); [x[j],x[k]]=[x[k],x[j]]; } return x; }
function dirType(d){ return d.startsWith("→ PASSIVE")?"P":d.startsWith("→ ACTIVE")?"A":"J"; }
function start(){
  deck = shuffle([...Q]);
  i=0; score=0; streak=0; bestStreak=0; missP=0; missA=0; missJ=0;
  document.getElementById('total').textContent = deck.length;
  document.getElementById('title').classList.add('hide');
  document.getElementById('end').classList.add('hide');
  document.getElementById('quiz').classList.remove('hide');
  const b = +localStorage.getItem('switchboss_best')||0;
  document.getElementById('best').textContent = b? b+'/'+deck.length : '–';
  show();
}
function show(){
  locked=false;
  const q = deck[i];
  document.getElementById('qno').textContent = `Q${i+1} / ${deck.length}`;
  const d = document.getElementById('dir');
  d.textContent = q.dir; d.className = 'dir ' + DIRCLASS[q.dir];
  document.getElementById('sentence').textContent = q.s;
  document.getElementById('fb').className='fb'; document.getElementById('fb').textContent='';
  document.getElementById('next').style.display='none';
  const box = document.getElementById('opts'); box.innerHTML='';
  q.opts.forEach((o,idx)=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=String.fromCharCode(65+idx)+'. '+o.t;
    b.onclick=()=>pick(idx,b); box.appendChild(b);
  });
  document.getElementById('bar').style.width=(i/deck.length*100)+'%';
}
function pick(idx, btn){
  if(locked) return; locked=true;
  const q = deck[i];
  const btns=[...document.getElementById('opts').children];
  btns.forEach((b,j)=>{ b.onclick=null; if(j!==idx) b.classList.add('dim'); });
  const good = q.opts[idx].ok;
  const goodBtn = btns[q.opts.findIndex(o=>o.ok)];
  goodBtn.classList.add('good'); if(!good) btns[idx].classList.add('bad');
  const fb=document.getElementById('fb');
  const dt = dirType(q.dir);
  if(good){
    score++; streak++; bestStreak=Math.max(bestStreak,streak);
    fb.className='fb ok';
    fb.innerHTML = `<b>✅ ${q.opts[idx].w}</b>` + (streak>=3?`<br>🔥 ${streak} 連勝！`:'');
  } else {
    streak=0; if(dt==='P')missP++; else if(dt==='A')missA++; else missJ++;
    fb.className='fb no';
    fb.innerHTML = `<b>❌ ${q.opts[idx].w}</b><br>正確答案：<b>${goodBtn.textContent}</b>`;
  }
  document.getElementById('score').textContent=score;
  document.getElementById('streak').textContent=streak;
  document.getElementById('next').style.display='inline-block';
}
function nextQ(){
  i++;
  if(i>=deck.length){ finish(); } else { show(); }
}
function finish(){
  document.getElementById('quiz').classList.add('hide');
  document.getElementById('end').classList.remove('hide');
  document.getElementById('bar').style.width='100%';
  const pct = Math.round(score/deck.length*100);
  document.getElementById('finalScore').textContent = `${score}/${deck.length} · ${pct}%`;
  let tips=[];
  if(missP>=2) tips.push('→PASSIVE 錯得多 → 加 be 前先唱：be + <b>V3</b>，will/must 後面個 be 唔准走');
  if(missA>=2) tips.push('→ACTIVE 錯得多 → doer 做 subject 之後，be 全部刪走');
  if(missJ>=2) tips.push('JUDGE 題錯得多 → 冇 receiver 嘅動詞（arrive/happen）永遠 active；啱嘅被動唔好郁');
  if(!tips.length) tips.push('全方向穩陣 — 功課 Part B 個 Boss 都唔怕你 💪');
  document.getElementById('finalStats').innerHTML =
    `🔥 Best streak: <b>${bestStreak}</b><br>` +
    `🧭 錯方向統計 — →PASSIVE: ${missP} · →ACTIVE: ${missA} · JUDGE: ${missJ}<br>` +
    `💡 ${tips.join('<br>💡 ')}`;
  const b=+localStorage.getItem('switchboss_best')||0;
  if(score>b) localStorage.setItem('switchboss_best',score);
}
</script>
</body>
</html>
