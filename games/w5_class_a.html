<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Storm-route quick-fire</title><style>*{box-sizing:border-box}body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:linear-gradient(145deg,#0c2440,#354d88);color:#eef6ff;margin:0;min-height:100vh}.wrap{max-width:680px;margin:auto;padding:20px 14px 40px}h1{font-size:clamp(24px,5vw,36px);margin:7px 0}p{line-height:1.5}.sub{color:#cddcff}.stage{text-align:center;font-size:50px;margin:14px 0;min-height:70px}.actor{display:inline-block;animation:bob 2s ease-in-out infinite}.actor.work{animation:work .6s ease-out}.actor.sleep{filter:grayscale(1);transform:rotate(22deg)}.beam{font-size:27px;display:inline-block;margin:0 12px}.beam.lit{animation:shine .7s ease-out}.card,.end{background:#fff;color:#1b2c4a;padding:22px;border-radius:18px;box-shadow:0 18px 38px #08182c66}.card.shake{animation:shake .35s}.prompt{font-size:clamp(19px,4.4vw,25px);font-weight:700;line-height:1.5;margin:16px 0}.progress{font-size:14px;color:#aee8ff;margin-bottom:12px}.feedback{background:#e9f4ff;border-left:5px solid #408ed0;border-radius:8px;padding:12px;margin:14px 0;animation:rise .25s}.bad{border-left-color:#dc6370;background:#ffedf0}.opt,button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;min-height:48px}button{background:#266dc3;color:white;font-weight:700}.opt{display:block;width:100%;text-align:left;background:#e7effa;color:#193258;margin:9px 0}.opt:hover{background:#cce3ff}.opt:disabled{opacity:.7;cursor:default}button:disabled{opacity:.5}.row{display:flex;gap:9px;flex-wrap:wrap}.yes{background:#188b64}.no{background:#c15058}.next{background:#664dba}.miss{background:#fff0f1;border-radius:8px;padding:9px;margin:8px 0;line-height:1.45}.review{max-height:340px;overflow:auto}.input{width:100%;min-height:45px;border:2px solid #a8bfdc;border-radius:8px;font:inherit;padding:8px;margin-bottom:10px}@keyframes bob{50%{transform:translateY(-6px)}}@keyframes work{50%{transform:scale(1.22) rotate(-8deg)}}@keyframes shine{50%{filter:drop-shadow(0 0 20px #ffe25d);transform:scale(1.5)}}@keyframes shake{25%,75%{transform:translateX(-7px)}50%{transform:translateX(7px)}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:480px){.card{padding:17px}.row button{flex:1}}</style><div class="wrap"><h1>Storm-route quick-fire</h1><p class="sub">堂上：睇句子 → 講答案 → 揭解釋 → 自評 → 下一題；冇複雜規則。</p><div class="stage">🧭 <span class="actor">🧑‍🏫</span> 🌧️</div><div class="card" id="card"><div class="progress" id="progress"></div><div class="prompt" id="prompt"></div><input class="input" id="typed" aria-label="Optional written answer" placeholder="可口頭答；想記錄就打答案"><div><button id="reveal" onclick="reveal()">揭答案 · show why</button></div><div class="feedback" id="feedback" hidden></div><div class="row" id="mark" hidden><button class="yes" onclick="mark(true)">✅ 我啱</button><button class="no" onclick="mark(false)">❌ 要再練</button></div><button class="next" id="advance" onclick="next()" hidden>下一題 →</button></div><div class="end" id="end" hidden><h2 id="result"></h2><h3>逐題回顧 · 錯題標紅</h3><div class="review" id="review"></div><button onclick="reset()">再玩一次</button></div><p class="sub">G9 · Term 1 · Week 5 · Set A · local practice</p></div><script>const BANK=[{"s": "The weather team headed toward the gym but turned back at the stairs.", "a": "Correct as written.", "w": "Toward means approach; turning back confirms no arrival."}, {"s": "The compass remained onto the librarian’s table all afternoon.", "a": "The compass remained on the librarian’s table all afternoon.", "w": "Remained is position, not movement onto a surface."}, {"s": "At the height of the storm, the skylight was being repair by the caretaker.", "a": "At the height of the storm, the skylight was being repaired by the caretaker.", "w": "An ongoing past passive needs was being + past participle repaired."}, {"s": "The scouts crawled through the narrow passage and emerged in the yard.", "a": "Correct as written.", "w": "Through means entry and exit."}, {"s": "Before the second alert, the side door had secure by the staff.", "a": "Before the second alert, the side door had been secured by the staff.", "w": "Earlier completed past passive needs had been + V3."}, {"s": "The rescue banner was carried away from the broken skylight.", "a": "Correct as written.", "w": "Away from shows movement increasing the distance."}, {"s": "The younger pupils were guided onto the sports court, where they stayed.", "a": "Correct as written.", "w": "Onto marks movement to a surface."}, {"s": "The paper compass stayed toward the low shelf, directly below it, all afternoon.", "a": "The paper compass stayed under the low shelf, directly below it, all afternoon.", "w": "Stayed and directly below signal position: under, not toward."}, {"s": "The route leaders had been led the group across the courtyard by noon.", "a": "The route leaders had led the group across the courtyard by noon.", "w": "The leaders are the doers, so use active had led; do not add been."}];let idx=0,score=0,miss=[],records=[];const $=x=>document.getElementById(x);const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function show(){if(idx===BANK.length){$('card').hidden=true;$('end').hidden=false;$('result').textContent='答啱 '+score+'/'+BANK.length+' · Missed '+miss.length;$('review').innerHTML=records.map((r,i)=>'<div class="'+(r.ok?'':'miss')+'"><b>'+(i+1)+'. '+safe(r.s)+'</b><br>你答：'+safe(r.your)+'<br>正解：'+safe(r.a)+'<br>💡 '+safe(r.w)+'</div>').join('');return}$('progress').textContent='第 '+(idx+1)+'/'+BANK.length+' 題 · ✅ '+score;$('prompt').textContent=BANK[idx].s;$('typed').value='';$('feedback').hidden=true;$('mark').hidden=true;$('advance').hidden=true;$('reveal').hidden=false;$('typed').hidden=false}function reveal(){let q=BANK[idx];$('feedback').innerHTML='<b>答案：'+safe(q.a)+'</b><br>💡 '+safe(q.w);$('feedback').hidden=false;$('reveal').hidden=true;$('mark').hidden=false}function mark(ok){let q=BANK[idx],your=$('typed').value.trim()||'（口頭作答）';records.push({s:q.s,a:q.a,w:q.w,your,ok});if(ok)score++;else{miss.push(q);$('card').classList.remove('shake');void $('card').offsetWidth;$('card').classList.add('shake')}$('mark').hidden=true;$('typed').hidden=true;$('advance').hidden=false}function next(){idx++;show()}function reset(){idx=0;score=0;miss=[];records=[];$('card').hidden=false;$('end').hidden=true;show()}reset();</script></html>
